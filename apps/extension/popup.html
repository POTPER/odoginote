<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GiNote 会话同步</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        font-size: 13px;
        color: #1e1e1e;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        color: #555;
        line-height: 1.45;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #7c3aed;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #666;
        min-height: 1.2em;
      }
      .error {
        color: #b91c1c;
      }
      .ok {
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <h1>GiNote 会话同步</h1>
    <p>将 GitHub 登录状态同步到 GiNote，用于图片附件上传与预览。</p>
    <button id="syncBtn" type="button">同步 GitHub 会话</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
